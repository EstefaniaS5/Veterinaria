name: Notion Sync

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - closed

jobs:
  update-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Update Notion page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_ID: 32bfd7d8bddb80469206e55e478170b6
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          if [ "$PR_ACTION" = "closed" ]; then
            STATUS="Listo"
          else
            STATUS="En curso"
          fi

          curl --fail --show-error --silent -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            --data "{
              \"properties\": {
                \"Status\": {
                  \"status\": {
                    \"name\": \"$STATUS\"
                  }
                },
                \"Pull Request\": {
                  \"url\": \"$PR_URL\"
                }
              }
            }"
